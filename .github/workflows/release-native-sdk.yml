name: release-native-sdk

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Native SDK (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-aarch64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build and test native SDK
        shell: bash
        env:
          EASYSQL_NATIVE_VERSION: ${{ github.ref_name }}
        run: bash scripts/test-native.sh
      - name: Create binary-only SDK archive
        shell: bash
        env:
          EASYSQL_NATIVE_VERSION: ${{ github.ref_name }}
          EASYSQL_RELEASE_OUTPUT: release-assets
        run: bash scripts/package-native-sdk.sh
      - name: Upload release asset
        uses: actions/upload-artifact@v6
        with:
          name: easysql-native-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download native SDK archives
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* --title "${TAG}" --generate-notes
          fi
